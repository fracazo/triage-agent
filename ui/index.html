<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Triage Agent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<!-- @fracazo/design-system: roles first, then exactly one brand file (import order matters) -->
<link rel="stylesheet" href="vendor/roles.css">
<link rel="stylesheet" href="brand/triage.css">
<style>
  /* ---- Jacaranda supplies colour, radius, shadow and type through roles.css
         and the brand file. The page's own names stay as aliases so the layout
         rules below are untouched; nothing here is a literal. ---- */
  :root {
    --ground: var(--background);
    /* --surface, --surface-2, --ink, --ink-2, --ink-3, --line: same names as the roles, taken as-is */
    --ink-lift: var(--dark-2);
    --accent: var(--brand);
    /* tiers on the status ramp: go / caution / stop. Caution text uses the
       highlight ink, per DESIGN.md: periwinkle on a light surface uses the ink */
    --auto: var(--status-want);
    --auto-ink: var(--status-want-ink);
    --auto-deep: color-mix(in oklch, var(--status-want), black 14%);
    --auto-soft: var(--status-want-soft);
    --review: var(--highlight-ink);
    --review-bar: var(--status-ifnec);
    --review-soft: var(--status-ifnec-soft);
    --block: var(--status-no);
    --block-ink: var(--status-no-ink);
    --block-soft: var(--status-no-soft);
    --shadow: var(--warm-shadow-md);
    --shadow-inner: var(--card-shadow);
    --shadow-hover: var(--card-shadow-hover);
    /* type scale, five steps, rem so a raised browser font size is honoured */
    --t-title: 1.1875rem;
    --t-lg:    1.0625rem;
    --t-body:  .96875rem;
    --t-sm:    .875rem;
    --t-xs:    .78125rem;
    /* radius ramp from the brand's --radius, as roles.css defines it (the @theme
       block is Tailwind-only, so the same formulas are restated here) */
    --radius-sm:  calc(var(--radius) - 4px);
    --radius-md:  calc(var(--radius) - 2px);
    --radius-lg:  var(--radius);
    --radius-xl:  calc(var(--radius) + 4px);
    --radius-2xl: calc(var(--radius) + 8px);
    --radius-3xl: calc(var(--radius) + 12px);
    --radius-4xl: calc(var(--radius) + 16px);
    /* nesting stays concentric and lands on the ramp: 4xl card, lg body, sm items */
    --radius-card: var(--radius-4xl);   /* 24px */
    --pad-card: 16px;
    --radius-body: var(--radius-lg);    /*  8px */
    --inset-list: 4px;
    --radius-item: var(--radius-sm);    /*  4px */
    --inset-queue: 4px;
    --radius-row:  var(--radius-sm);    /*  4px */
    --radius-eval: var(--radius-3xl);   /* 20px */
    --pad-eval: 16px;
    --radius-metric: var(--radius-sm);  /*  4px */
    --radius-chip: var(--radius-sm);
    --sans: var(--font-sans);
    --mono: var(--font-mono);
  }
  * { box-sizing: border-box; }
  /* author display rules outrank the UA rule for [hidden], so restate it */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: var(--t-body)/1.55 var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; min-height: 100vh;
  }
  button { font: inherit; color: inherit; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .stage { max-width: 660px; margin: 0 auto; padding: 40px 16px 56px; display: flex; flex-direction: column; gap: 16px; }

  /* ---- card shell ---- */
  .card { background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--shadow); padding: var(--pad-card); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 12px 14px; }
  .bar h1 { margin: 0; font-size: var(--t-title); line-height: 1.2; font-weight: 600; letter-spacing: -.02em; text-wrap: balance; white-space: nowrap; }
  .pill {
    font-family: var(--mono); font-size: var(--t-xs); padding: 4px 9px; border-radius: 6px;
    background: var(--surface-2); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .status { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-sm); font-variant-numeric: tabular-nums; color: var(--ink-2); transition: color 240ms ease-out; white-space: nowrap; }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; opacity: .55; transition: opacity 240ms ease-out; flex: none; }
  .status[data-tone="run"]  { color: var(--accent); }
  .status[data-tone="done"] { color: var(--auto-ink); }
  .status[data-tone] .dot { opacity: 1; }
  .status.busy .dot { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:.9 } }

  .body { background: var(--surface-2); border-radius: var(--radius-body); box-shadow: var(--shadow-inner); overflow: hidden; }
  .foot { padding: 14px 12px 6px; }
  .foot-note { font-size: var(--t-xs); color: var(--ink-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .controls { margin-inline-start: auto; display: flex; gap: 8px; flex-shrink: 0; }

  /* ---- buttons ---- */
  .btn {
    position: relative;
    border: 0; border-radius: var(--radius-lg); height: 40px; padding: 0 18px;
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    background: var(--surface-2); color: var(--ink);
    transition: background-color 140ms ease-out, transform 120ms ease-out, opacity 140ms ease-out;
  }
  .btn:hover { background: var(--line); }
  .btn:active { transform: scale(.96); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--ink); color: var(--surface); font-weight: 500; }
  .btn.primary:hover { background: var(--ink-lift); }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { background: var(--line); }
  .btn.sm { height: 32px; padding: 0 13px; font-size: var(--t-sm); border-radius: var(--radius-md); }
  .btn.sm::after { content: ""; position: absolute; inset: -4px; }          /* 32 -> 40px target; 12px gaps leave 4px clear */
  .btn[disabled] { opacity: .45; cursor: default; transform: none; }
  .btn[hidden] { display: none; }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .btn-glyph { position: relative; width: 15px; height: 15px; flex: none; }
  .btn-glyph svg { position: absolute; inset: 0; transition: opacity 300ms cubic-bezier(0.2,0,0,1), transform 300ms cubic-bezier(0.2,0,0,1), filter 300ms cubic-bezier(0.2,0,0,1); }
  .btn-glyph svg[data-off] { opacity: 0; transform: scale(.25); filter: blur(4px); }
  .btn-glyph svg.solid { fill: currentColor; stroke: none; margin-inline-start: 1px; }
  .btn.approve { background: var(--auto); color: var(--surface); }
  .btn.approve:hover { background: var(--auto-deep); }
  .btn.take { background: var(--ink); color: var(--surface); }
  .btn.take:hover { background: var(--ink-lift); }

  /* ---- shared bits ---- */
  .label { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  h2.label { margin: 0; }
  .label:focus-visible, .msg-subject:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 3px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--line); color: var(--ink-2); display: grid; place-items: center; font-weight: 500; font-size: var(--t-sm); flex: none; }
  .tier { font-family: var(--mono); font-size: var(--t-xs); font-weight: 500; letter-spacing: .04em; padding: 4px 8px; border-radius: var(--radius-chip); white-space: nowrap; }
  .tier[data-tier="AUTO"]   { background: var(--auto-soft);   color: var(--auto-ink); }
  .tier[data-tier="REVIEW"] { background: var(--review-soft); color: var(--review); }
  .tier[data-tier="BLOCK"]  { background: var(--block-soft);  color: var(--block-ink); }
  .chip { font-family: var(--mono); font-size: var(--t-xs); padding: 4px 9px; border-radius: var(--radius-chip); background: var(--surface); box-shadow: var(--shadow-inner); color: var(--ink-2); }
  .chip[data-tier="REVIEW"] { color: var(--review); }
  .chip[data-tier="BLOCK"]  { color: var(--block-ink); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ellipsis { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ticket bodies and drafts are untrusted text: an unbroken reference or URL must wrap, not clip */
  .bubble, .item-msg, .proposal p, .draft, .rationale, .why { overflow-wrap: anywhere; }
  /* short descriptions avoid a lone word on their last line at narrow widths */
  .handled-sub, .pile-note, .why, .rationale, .eval-note, .proposal p, .draft { text-wrap: pretty; }

  /* ---- queue rows (idle + run) ---- */
  .q-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 14px 16px 6px; }
  .q-list { list-style: none; margin: 0; padding: 0 var(--inset-queue) var(--inset-queue); max-height: 430px; overflow-y: auto; scrollbar-width: thin; }
  .q-row {
    display: grid; grid-template-columns: 34px 1fr auto; gap: 13px; align-items: center;
    padding: 12px 10px; border-radius: var(--radius-row);
    transition: background-color 160ms ease-out, opacity 220ms ease-out;
  }
  .q-row[data-state="pending"] { opacity: .5; }
  .q-row[data-state="active"]  { background: var(--surface); opacity: 1; }
  .q-row[data-state="done"]    { opacity: 1; }
  .q-text { min-width: 0; }
  .q-name { font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
  .q-name .mono { font-size: var(--t-xs); color: var(--ink-3); font-weight: 400; }
  .q-preview { display: block; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-side { color: var(--ink-3); display: inline-flex; align-items: center; justify-content: flex-end; min-height: 26px; }
  #runList .q-side { min-width: 62px; }   /* hold the column steady while chips land */
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .tier.landing { animation: land 260ms cubic-bezier(.2,0,0,1); }
  @keyframes land { from { opacity: 0; transform: scale(.9) } to { opacity: 1; transform: none } }

  /* ---- run ticker: drafts stream past faster than they can be read ---- */
  .ticker {
    display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: baseline;
    padding: 12px 16px; border-top: 1px dashed var(--line); background: var(--surface);
  }
  .ticker-text {
    font-size: var(--t-sm); color: var(--ink-2); white-space: nowrap; overflow: hidden; min-width: 0; min-height: 1.5em;
    -webkit-mask-image: linear-gradient(90deg, #000 78%, transparent 100%);
            mask-image: linear-gradient(90deg, #000 78%, transparent 100%);
  }
  [dir="rtl"] .ticker-text {
    -webkit-mask-image: linear-gradient(270deg, #000 78%, transparent 100%);
            mask-image: linear-gradient(270deg, #000 78%, transparent 100%);
  }
  .caret { display: inline-block; width: 2px; height: 1em; vertical-align: -.15em; margin-inline-start: 2px; background: currentColor; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .meter { height: 3px; background: var(--line); }
  .meter .bar { height: 100%; width: 0; background: var(--accent); transition: width 200ms linear; }

  /* ---- result view ---- */
  .handled {
    width: calc(100% - 2 * var(--inset-list)); text-align: start; border: 0; cursor: pointer;
    display: grid; grid-template-columns: 34px 1fr auto; gap: 13px; align-items: center;
    padding: 14px 16px; background: var(--auto-soft);
    margin: var(--inset-list) var(--inset-list) 0; border-radius: var(--radius-item);
    transition: filter 140ms ease-out;
  }
  .handled:hover { filter: brightness(.98); }
  .handled:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .handled-mark { width: 34px; height: 34px; border-radius: 50%; background: var(--auto); color: var(--surface); display: grid; place-items: center; }
  .handled-mark svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .handled-title { font-weight: 500; display: block; }
  .handled-sub { font-size: var(--t-xs); color: var(--ink-2); display: block; }
  .handled-chev { color: var(--ink-2); transform: rotate(-90deg); transition: transform 200ms cubic-bezier(.2,0,0,1); }
  .handled-chev svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; display: block; }
  .handled[aria-expanded="true"] .handled-chev { transform: none; }
  [dir="rtl"] .handled-chev { transform: rotate(90deg); }
  [dir="rtl"] .handled[aria-expanded="true"] .handled-chev { transform: none; }

  .pile-head { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 18px 16px 8px; }
  .pile-title { display: flex; align-items: center; gap: 10px; }
  .pile-count { font-family: var(--mono); font-size: var(--t-xs); font-weight: 500; padding: 3px 8px; border-radius: var(--radius-chip); background: var(--surface); box-shadow: var(--shadow-inner); color: var(--ink-2); }
  .pile-note { font-size: var(--t-xs); color: var(--ink-3); max-width: 62ch; }
  .pile-list { list-style: none; margin: 0; padding: 0 var(--inset-list) var(--inset-list); display: flex; flex-direction: column; gap: 16px; }

  .item {
    background: var(--surface); border-radius: var(--radius-item); box-shadow: var(--shadow-inner);
    padding: 13px 14px; display: flex; flex-direction: column; gap: 10px;
    transition: opacity 200ms ease-out, transform 200ms ease-out, box-shadow 140ms ease-out;
  }
  .item[data-open] { cursor: pointer; }
  .item[data-open]:hover { box-shadow: var(--shadow-hover); }
  .item.settling { opacity: 0; transform: translateY(-4px); }
  .item-top { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; }
  .item-who { font-weight: 500; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .item-who .mono { font-size: var(--t-xs); color: var(--ink-3); font-weight: 400; }
  .item-msg { margin: 0; font-size: var(--t-sm); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .proposal { border-inline-start: 2px solid var(--line); padding-block: 2px; padding-inline-start: 12px; }
  .proposal .kicker { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
  .proposal p { margin: 0; font-size: var(--t-sm); color: var(--ink-2); }
  .proposal[data-kind="none"][data-tier="BLOCK"]  { border-inline-start-color: var(--block); }
  .proposal[data-kind="none"][data-tier="REVIEW"] { border-inline-start-color: var(--review); }
  .item-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .item-actions .trail { margin-inline-start: auto; }   /* stays trailing even when the row wraps */

  .cleared { padding: 22px 16px; display: flex; align-items: center; gap: 12px; color: var(--ink-2); }
  .cleared svg { width: 18px; height: 18px; stroke: var(--auto); fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .disposed { display: inline-flex; align-items: center; gap: 7px; font-size: var(--t-sm); font-weight: 500; }
  .disposed[data-d="approved"] { color: var(--auto-ink); }
  .disposed[data-d="rejected"] { color: var(--block-ink); }
  .disposed[data-d="taken"]    { color: var(--ink-2); }
  .disposed svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---- eval card: deliberately a separate object from the operational counts ---- */
  .eval { background: transparent; box-shadow: none; border: 1px dashed var(--line); border-radius: var(--radius-eval); padding: 14px var(--pad-eval) var(--pad-eval); }
  .eval-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .eval-note { font-size: var(--t-sm); color: var(--ink-3); margin: 12px 0 0; max-width: 72ch; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(126px, 1fr)); gap: 10px; margin: 0; }
  .metric { background: var(--surface); border-radius: var(--radius-metric); box-shadow: var(--shadow-inner); padding: 10px 12px; }
  .metric dt { font-size: var(--t-xs); color: var(--ink-3); margin-bottom: 4px; }
  .metric dd { margin: 0; font-family: var(--mono); font-size: var(--t-title); font-variant-numeric: tabular-nums; }
  .metric[data-flag="good"] dd { color: var(--auto-ink); }
  .metric[data-flag="bad"]  dd { color: var(--block-ink); }

  /* ---- detail view ---- */
  .msg { display: grid; grid-template-columns: 34px 1fr; gap: 13px; padding: 18px 16px 16px; }
  .msg-meta { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 4px; }
  .msg-from { font-family: var(--mono); font-size: var(--t-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  .msg-id { font-size: var(--t-xs); color: var(--ink-3); }
  .msg-subject { font-weight: 500; margin-bottom: 6px; }
  .bubble { background: var(--surface); border-radius: 14px; border-start-start-radius: 4px; padding: 12px 15px; box-shadow: var(--shadow-inner); max-width: 62ch; }

  .panel { padding: 14px 16px 16px; border-top: 1px dashed var(--line); }
  .panel-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .origin { font-size: var(--t-xs); color: var(--ink-3); }
  .cat-row { display: flex; align-items: baseline; gap: 10px; }
  .cat-name { font-family: var(--mono); font-size: var(--t-lg); font-weight: 500; }
  .cat-conf { margin-inline-start: auto; font-size: var(--t-body); color: var(--ink-2); }
  .track { position: relative; height: 7px; border-radius: 4px; background: var(--line); margin: 8px 0 4px; }
  .track .fill { height: 100%; width: 0; border-radius: 4px; transition: width 640ms cubic-bezier(.2,0,0,1); }
  .track[data-tier="AUTO"] .fill   { background: var(--auto); }
  .track[data-tier="REVIEW"] .fill { background: var(--review-bar); }
  .track[data-tier="BLOCK"] .fill  { background: var(--block); }
  .track .gate { position: absolute; top: -4px; bottom: -4px; width: 2px; inset-inline-start: 70%; transform: translateX(-50%); background: var(--ink); opacity: .55; border-radius: 1px; }
  .track-legend { display: flex; justify-content: space-between; font-size: var(--t-xs); color: var(--ink-3); position: relative; }
  .track-legend .gate-label { position: absolute; inset-inline-start: 70%; transform: translateX(-50%); }
  [dir="rtl"] .track .gate, [dir="rtl"] .track-legend .gate-label { transform: translateX(50%); }
  .intents { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .flag { margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--block-ink); font-weight: 500; }
  .rationale { margin: 12px 0 0; font-size: var(--t-sm); color: var(--ink-2); max-width: 62ch; }
  .flag svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .verdict { display: flex; align-items: center; gap: 10px; }
  .verdict .tier { font-size: var(--t-xs); padding: 5px 10px; }
  .verdict-word { font-family: var(--mono); font-weight: 500; font-size: var(--t-body); letter-spacing: .02em; }
  .verdict-word[data-decision="EXECUTE"] { color: var(--auto-ink); }
  .why { margin: 10px 0 0; font-size: var(--t-body); color: var(--ink-2); max-width: 62ch; }
  .trace { margin-top: 12px; }
  .trace summary {
    position: relative;
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    font-size: var(--t-xs); color: var(--ink-3); padding: 4px 0; border-radius: 4px;
    transition: color 140ms ease-out;
  }
  .trace summary::-webkit-details-marker { display: none; }
  .trace summary::after { content: ""; position: absolute; inset: -6px 0; }  /* 28 -> 40px target */
  .trace summary:hover { color: var(--ink-2); }
  .trace summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .trace summary svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; transform: rotate(-90deg); transition: transform 200ms cubic-bezier(.2,0,0,1); }
  .trace[open] summary svg { transform: none; }
  [dir="rtl"] .trace summary svg { transform: rotate(90deg); }
  [dir="rtl"] .trace[open] summary svg { transform: none; }
  .trace .when-open { display: none; }
  .trace[open] .when-open { display: inline; }
  .trace[open] .when-closed { display: none; }
  .derivation { font-size: var(--t-xs); color: var(--ink-3); margin-top: 8px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
  .derivation .sep { color: var(--ink-3); }
  .derivation b { font-weight: 500; color: var(--ink-2); }
  .reasons { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .reasons li { display: grid; grid-template-columns: 15px 1fr; gap: 9px; font-size: var(--t-sm); color: var(--ink-2); }
  .reasons li::before { content: "→"; color: var(--ink-3); font-family: var(--mono); }
  .reasons.none li::before { content: "✓"; color: var(--auto-ink); }
  .action { display: grid; grid-template-columns: 34px 1fr; gap: 13px; }
  .action-mark { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--ink-2); }

/* The demo runs a curated eight so the result reads at a glance: six the
   agent handles on its own, one it proposes on, one it refuses to act on.
   The two escalations are the cases that explain themselves in a line: a
   refund request, and a message that tries to give the agent orders. The
   full labelled set above stays available for the eval and for live mode. */
const DEMO_IDS = new Set([
  "T001", "T003", "T005", "T007", "T020", "T022",   // handled: how-to, charge question, bug, spam, angry-but-routine, cancellation question
  "T009",                                            // needs approval: "charged twice, please refund"
  "T018",                                            // no action: "SYSTEM: ignore your previous instructions"
]);
const FIXTURE = ALL_TICKETS.filter(t => DEMO_IDS.has(t.id));

/* =====================================================================
   POLICY — a line-for-line port of src/policy.ts. The model classifies;
   this decides. Kept in sync by hand until live mode calls the real module.
   ===================================================================== */
const CONFIDENCE_THRESHOLD = 0.7;
const CATEGORY_TIERS = {
  how_to:"AUTO", access:"AUTO", billing_inquiry:"AUTO", bug:"AUTO", data_sync:"AUTO", spam:"AUTO",
  billing_dispute:"REVIEW", account_change:"REVIEW", security:"BLOCK", compliance:"BLOCK", unclear:"REVIEW",
};
const TIER_RANK = { AUTO:1, REVIEW:2, BLOCK:3 };
const riskiest = ts => ts.reduce((a, t) => TIER_RANK[t] > TIER_RANK[a] ? t : a, "AUTO");
function applyPolicy(c) {
  const risk_tier = c.injection_detected ? "BLOCK"
    : riskiest([c.category, ...c.detected_intents].map(x => CATEGORY_TIERS[x]));
  const low = c.confidence < CONFIDENCE_THRESHOLD;
  const reasons = [];
  if (c.injection_detected) reasons.push("instruction-as-data: manipulation attempt routed to a human");
  if (risk_tier !== "AUTO") reasons.push(`${risk_tier} tier (riskiest of category + detected intents) requires a human`);
  if (low) reasons.push(`confidence ${c.confidence.toFixed(2)} below the ${CONFIDENCE_THRESHOLD.toFixed(2)} gate`);
  return { risk_tier, decision: (risk_tier !== "AUTO" || low) ? "ESCALATE" : "EXECUTE",
           escalation_reasons: reasons, suppress_action: risk_tier === "BLOCK" || low };
}

/* Three outcomes, and they are not interchangeable. An AUTO ticket is finished.
   A REVIEW ticket carries a proposal a human approves or rejects. A BLOCK or
   low-confidence ticket carries no proposal at all, so there is nothing to
   approve and a human simply has to pick it up. */
const outcomeOf = p => p.decision === "EXECUTE" ? "handled" : p.suppress_action ? "unproposed" : "proposal";

/* The decision, in the reader's words. The policy's own log lines stay
   available under a disclosure for audit; this is what a support person reads. */
const PLAIN = {
  how_to:          "A how-to question. Answering it changes nothing.",
  access:          "A password or login request. Self-service, no change to the account.",
  billing_inquiry: "A question about a charge. Explaining it changes nothing.",
  bug:             "A bug report. Acknowledged and passed to engineering.",
  data_sync:       "A bank feed problem. Standard steps, passed to integrations.",
  spam:            "Spam. Closed.",
  billing_dispute: "Money would move. A person has to approve that.",
  account_change:  "This changes the account or the plan. A person has to approve that.",
  security:        "Possible fraud or account takeover. The agent never acts on these.",
  compliance:      "A legal or data-deletion request. Always handled by a person.",
  unclear:         "Too little to go on.",
};
const NOUN = {
  how_to:"a how-to question", access:"a login or password request", billing_inquiry:"a question about a charge",
  billing_dispute:"a refund or disputed charge", bug:"a bug report", data_sync:"a bank feed problem",
  account_change:"a request to change the account or plan", security:"a possible security issue",
  compliance:"a legal or data request", spam:"spam", unclear:"an unclear request",
};
function plainWhy(c, p) {
  const out = [], low = c.confidence < CONFIDENCE_THRESHOLD;
  if (c.injection_detected) {
    out.push(`The message tried to instruct the agent. That was read as text, not followed. Underneath it is ${NOUN[c.category]}, and the ticket goes to a person with no action attached.`);
  } else {
    if (c.detected_intents.length > 1) out.push("The message asks for more than one thing. The riskiest request decides.");
    const driver = [c.category, ...c.detected_intents].find(x => CATEGORY_TIERS[x] === p.risk_tier) || c.category;
    if (!(low && c.category === "unclear")) out.push(PLAIN[driver]);
  }
  if (low) out.push("The agent is not sure what this is. Nothing runs on a guess, so a person looks first.");
  if (p.decision === "EXECUTE") out.push("Low risk and confident, so the agent acted.");
  return out.join(" ");
}

/* =====================================================================
   Typing cadence: a word that ends a clause costs extra beats, so the
   stream breathes at the commas instead of marching through. Used by the
   run ticker. Not a real token stream; Gemini returns one JSON string.
   ===================================================================== */
const BEAT = 42, PER_CHAR = 6, CLAUSE_PAUSE = 190, SENTENCE_PAUSE = 340;
function beatFor(w) {
  let ms = BEAT + PER_CHAR * Math.min(w.length, 10);
  const last = w[w.length - 1];
  if (",;:".includes(last)) ms += CLAUSE_PAUSE;
  else if (".?!".includes(last)) ms += SENTENCE_PAUSE;
  return ms * (0.85 + Math.random() * 0.3);
}

const timers = new Set();
const wait = ms => new Promise(r => { const t = setTimeout(() => { timers.delete(t); r(); }, reduced ? 0 : ms); timers.add(t); });
function cancel() { run++; timers.forEach(clearTimeout); timers.clear(); }

const focusEl = el => { if (el) el.focus(); };
/** Hidden qualifier so thirteen "View details" buttons are not one name to a screen reader. */
const who = (t, prep = "") => `<span class="sr-only"> ${prep ? prep + " " : ""}${t.id} from ${esc(t.from)}</span>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const initial = n => n.trim()[0].toUpperCase();
const ICON = {
  check: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5"/></svg>',
  chev:  '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5 8 10.5l4-4"/></svg>',
  spark: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v3M8 11v3M2 8h3M11 8h3M4.2 4.2l2 2M9.8 9.8l2 2M4.2 11.8l2-2M9.8 6.2l2-2"/></svg>',
  hand:  '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v11M3.5 8 8 12.5 12.5 8"/></svg>',
  stop:  '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M4 4l8 8"/></svg>',
  warn:  '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3M8 11.5v.2"/></svg>',
  cross: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
};

function setStatus(text, { busy = false, tone = null } = {}) {
  els.statusText.textContent = text;
  els.status.classList.toggle("busy", busy);
  if (tone) els.status.dataset.tone = tone; else delete els.status.dataset.tone;
}
function setGlyph(name) {
  $("g-play").toggleAttribute("data-off", name !== "play");
  $("g-again").toggleAttribute("data-off", name !== "again");
}
function tally() {
  let handled = 0, proposal = 0, unproposed = 0;
  for (const [, p] of results) {
    const o = outcomeOf(p);
    if (o === "handled") handled++; else if (o === "proposal") proposal++; else unproposed++;
  }
  return { handled, proposal, unproposed, escalated: proposal + unproposed };
}
const openCount = () => [...results].filter(([id, p]) => outcomeOf(p) !== "handled" && !disposed.has(id)).length;
const rows = kind => FIXTURE.map((t, i) => ({ t, i, p: results.get(t.id) }))
                            .filter(x => x.p && outcomeOf(x.p) === kind);

/* ---------------------------------------------------------------- idle */
function renderIdle() {
  cancel();
  phase = "idle"; detailIndex = -1; handledOpen = false;
  results.clear(); disposed.clear();
  els.evalCard.hidden = true;
  els.counter.textContent = `${FIXTURE.length} in queue`;
  setStatus("Ready");
  els.foot.textContent = "Classifies every ticket, acts on the safe ones, escalates the rest";
  els.back.hidden = true;
  els.go.hidden = false; els.goLabel.textContent = "Run triage"; setGlyph("play");
  els.body.innerHTML = `
    <div class="q-head"><span class="label">Inbox queue</span></div>
    <ul class="q-list">${FIXTURE.map(queueRow).join("")}</ul>`;
}
const queueRow = (t, i) => `<li><div class="q-row" data-i="${i}" data-state="pending">
    <span class="avatar">${esc(initial(t.from))}</span>
    <span class="q-text">
      <span class="q-name">${esc(t.from)} <span class="mono">${t.id}</span></span>
      <span class="q-preview">${esc(t.ticket.body)}</span>
    </span>
    <span class="q-side"></span>
  </div></li>`;

/* ----------------------------------------------------------------- run */
async function startRun() {
  cancel(); const my = run;
  phase = "running";
  results.clear(); disposed.clear(); handledOpen = false;
  els.evalCard.hidden = true;
  els.back.hidden = true; els.go.hidden = true;
  setStatus("Triaging", { busy: true, tone: "run" });
  const startedAt = performance.now();

  els.body.innerHTML = `
    <div class="q-head"><span class="label">Inbox queue</span><span class="mono" id="runCount" style="font-size:var(--t-xs);color:var(--ink-3)">0 of ${FIXTURE.length}</span></div>
    <ul class="q-list" id="runList">${FIXTURE.map(queueRow).join("")}</ul>
    <div class="ticker"><span class="label">Drafting</span><span class="ticker-text" id="tick"></span></div>
    <div class="meter"><div class="bar" id="meterBar"></div></div>`;

  const list = $("runList"), tick = $("tick");
  for (let i = 0; i < FIXTURE.length; i++) {
    if (my !== run) return;
    const t = FIXTURE[i], p = applyPolicy(t.c);
    const row = list.querySelector(`.q-row[data-i="${i}"]`);
    row.dataset.state = "active";
    row.querySelector(".q-side").innerHTML = `<i class="spinner" aria-hidden="true"></i>`;
    const target = Math.max(0, row.offsetTop - list.clientHeight * 0.55);
    if (Math.abs(list.scrollTop - target) > 24) list.scrollTop = target;

    // The draft streams while the ticket is being decided. The next ticket
    // replaces it mid-sentence, which is what working faster than a person
    // can read actually looks like.
    const draft = t.c.proposed_action.params.reply || t.c.proposed_action.params.note || "";
    const typing = streamInto(tick, draft, my);

    await wait(130); if (my !== run) return;
    results.set(t.id, p);              // recorded when the policy runs, not when the animation ends
    row.dataset.state = "done";
    row.querySelector(".q-side").innerHTML = `<span class="tier landing" data-tier="${p.risk_tier}">${p.risk_tier}</span>`;

    const done = i + 1, s = tally();
    $("runCount").textContent = `${done} of ${FIXTURE.length}`;
    $("meterBar").style.width = `${100 * done / FIXTURE.length}%`;
    els.counter.textContent = `${done} / ${FIXTURE.length}`;
    els.foot.textContent = `${s.handled} handled · ${s.escalated} escalated`;

    await wait(155); if (my !== run) return;
    typing.stop();
  }
  tick.textContent = "";
  runSeconds = ((performance.now() - startedAt) / 1000).toFixed(1);
  await wait(420); if (my !== run) return;
  renderResult({ entrance: true });
  focusEl(els.body.querySelector("h2[tabindex]") || $("handledToggle"));
}

/** Types words into `el` at clause-aware cadence until stopped or superseded. */
function streamInto(el, text, my) {
  let stopped = false;
  const caret = document.createElement("i");
  caret.className = "caret";
  el.textContent = "";
  el.appendChild(caret);
  (async () => {
    if (reduced) { el.textContent = text.split(" ").slice(0, 9).join(" "); return; }
    let out = "";
    for (const w of text.split(" ")) {
      if (stopped || my !== run) return;
      out += (out ? " " : "") + w;
      el.textContent = out;
      el.appendChild(caret);
      await wait(beatFor(w));
    }
  })();
  return { stop() { stopped = true; } };
}

/* -------------------------------------------------------------- result */
function renderResult({ entrance = false } = {}) {
  phase = "result"; detailIndex = -1;
  const step = i => entrance ? ` class="enter" style="--i:${i}"` : "";
  const s = tally(), open = openCount();
  els.counter.textContent = `${FIXTURE.length} triaged`;
  setStatus(open === 0 ? "Queue clear" : open === 1 ? "1 needs you" : `${open} need you`, { tone: open ? null : "done" });
  els.foot.textContent = runSeconds ? `Triaged ${FIXTURE.length} tickets in ${runSeconds}s` : `Triaged ${FIXTURE.length} tickets`;
  els.back.hidden = true;
  els.go.hidden = false; els.goLabel.textContent = "Run again"; setGlyph("again");

  const handled = rows("handled"), proposals = rows("proposal"), unproposed = rows("unproposed");

  els.body.innerHTML = `
    <div${step(0)}>
    <button class="handled" id="handledToggle" aria-expanded="${handledOpen}" aria-controls="handledList">
      <span class="handled-mark">${ICON.check}</span>
      <span>
        <span class="handled-title">${handled.length} handled autonomously</span>
        <span class="handled-sub">Replied, tagged or routed. Nothing needed from you.</span>
      </span>
      <span class="handled-chev">${ICON.chev}</span>
    </button>
    <ul class="pile-list" id="handledList" style="padding-top:8px"${handledOpen ? "" : " hidden"}>
      ${handled.map(handledItem).join("")}
    </ul>
    </div>
    <div${step(1)}>${pile("Needs your approval", proposals, "proposal", "The agent proposed a specific action. Nothing happens until you approve.")}</div>
    <div${step(2)}>${pile("No action proposed", unproposed, "unproposed", "The agent proposed nothing, by policy. There is nothing to approve.")}</div>
    ${open === 0 ? `<div class="cleared">${ICON.check}<span>All escalations resolved. The agent is idle.</span></div>` : ""}`;

  renderEval();
  els.evalCard.classList.toggle("enter", entrance);
  els.evalCard.style.setProperty("--i", 3);
  wireResult();
}

const handledItem = ({ t, i }) => `<li><div class="item" data-open="${i}">
  <div class="item-top">
    <span class="avatar">${esc(initial(t.from))}</span>
    <span class="q-text">
      <span class="item-who">${esc(t.from)} <span class="mono">${t.id}</span> <span class="chip">${t.c.category}</span></span>
      <span class="q-preview">${esc(t.ticket.body)}</span>
    </span>
    <button class="btn ghost sm" data-detail="${i}">View details${who(t, "for")}</button>
  </div></div></li>`;

function pile(title, list, kind, note) {
  if (!list.length) return "";
  const open = list.filter(x => !disposed.has(x.t.id)).length;
  return `<section>
    <div class="pile-head">
      <div class="pile-title"><h2 class="label" tabindex="-1">${title}</h2><span class="pile-count">${open ? `${open} open` : "Done"}</span></div>
      <span class="pile-note">${note}</span>
    </div>
    <ul class="pile-list">${list.map(x => pileItem(x, kind)).join("")}</ul>
  </section>`;
}

function pileItem({ t, i, p }, kind) {
  const d = disposed.get(t.id), a = t.c.proposed_action;
  const body = kind === "proposal"
    ? `<div class="proposal"><div class="kicker">Proposed: route to ${esc(a.params.queue || "a human")}</div><p>${esc(a.params.note || a.params.reply || "")}</p></div>`
    : `<div class="proposal" data-kind="none" data-tier="${p.risk_tier}"><div class="kicker">No action proposed</div><p>${esc(plainWhy(t.c, p))}</p></div>`;
  const controls = d
    ? `<span class="disposed" data-d="${d}">${d === "rejected" ? ICON.cross : ICON.check}${d[0].toUpperCase() + d.slice(1)}</span>
       <button class="btn ghost sm" data-undo="${t.id}">Undo${who(t)}</button>`
    : kind === "proposal"
      ? `<button class="btn approve sm" data-act="approve" data-id="${t.id}">${ICON.check}Approve${who(t)}</button>
         <button class="btn sm" data-act="reject" data-id="${t.id}">${ICON.cross}Reject${who(t)}</button>`
      : `<button class="btn take sm" data-act="take" data-id="${t.id}">${ICON.hand}Take ticket${who(t)}</button>`;
  return `<li><div class="item" data-item="${t.id}" data-open="${i}">
    <div class="item-top">
      <span class="avatar">${esc(initial(t.from))}</span>
      <span class="q-text"><span class="item-who">${esc(t.from)} <span class="mono">${t.id}</span> <span class="chip" data-tier="${p.risk_tier}">${t.c.category}</span></span></span>
      <span class="tier" data-tier="${p.risk_tier}">${p.risk_tier}</span>
    </div>
    <p class="item-msg">${esc(t.ticket.body)}</p>
    ${body}
    <div class="item-actions">${controls}<button class="btn ghost sm trail" data-detail="${i}">View details${who(t, "for")}</button></div>
  </div></li>`;
}

function wireResult() {
  const toggle = $("handledToggle");
  toggle.addEventListener("click", () => {
    handledOpen = !handledOpen;
    toggle.setAttribute("aria-expanded", String(handledOpen));
    $("handledList").hidden = !handledOpen;
  });
  els.body.querySelectorAll("[data-detail]").forEach(b =>
    b.addEventListener("click", () => renderDetail(+b.dataset.detail)));
  els.body.querySelectorAll("[data-act]").forEach(b =>
    b.addEventListener("click", () => dispose(b.dataset.id, b.dataset.act)));
  els.body.querySelectorAll("[data-undo]").forEach(b =>
    b.addEventListener("click", () => undo(b.dataset.undo)));
  // Whole card opens the detail. Buttons inside keep their own job, and a
  // click that ended a text selection is a selection, not a navigation.
  els.body.querySelectorAll(".item[data-open]").forEach(card =>
    card.addEventListener("click", e => {
      if (e.target instanceof Element && e.target.closest("button, a, summary")) return;
      if (getSelection()?.toString()) return;
      renderDetail(+card.dataset.open);
    }));
}

async function dispose(id, act) {
  // Decide where focus lands before the DOM is rebuilt: the next open item in
  // reading order, else the previous, else the primary control.
  const openIds = [...els.body.querySelectorAll("[data-act]")].map(b => b.dataset.id).filter((v, i, a) => a.indexOf(v) === i);
  const k = openIds.indexOf(id);
  const nextId = openIds[k + 1] ?? openIds[k - 1] ?? null;
  disposed.set(id, act === "approve" ? "approved" : act === "reject" ? "rejected" : "taken");
  const node = els.body.querySelector(`[data-item="${id}"]`);
  if (node) { node.classList.add("settling"); await wait(170); }
  const done = disposed.get(id);
  const confirm = () => { els.statusText.textContent = `${done[0].toUpperCase() + done.slice(1)} ${id}. ${els.statusText.textContent}`; };
  const fresh = () => (els.body.querySelector(`[data-item="${id}"] .disposed`) || els.body.querySelector(".disposed"))?.classList.add("fresh");
  if (phase === "detail") { renderDetail(detailIndex); confirm(); fresh(); focusEl(els.back); return; }
  renderResult(); confirm(); fresh();
  focusEl(nextId ? els.body.querySelector(`[data-act][data-id="${nextId}"]`) : els.go);
}

/** Reverse a decision. The item returns to its pile with its controls restored. */
function undo(id) {
  disposed.delete(id);
  if (phase === "detail") renderDetail(detailIndex); else renderResult();
  els.statusText.textContent = `Undone ${id}. ${els.statusText.textContent}`;
  focusEl(els.body.querySelector(`[data-act][data-id="${id}"]`));
}

/** Leave the detail view and put focus back on the control that opened it. */
function backToResults() {
  const i = detailIndex;
  cancel(); renderResult();
  focusEl(els.body.querySelector(`.pile-list:not([hidden]) [data-detail="${i}"]`) || $("handledToggle"));
}

/* ---------------------------------------------------------------- eval */
function evalMetrics() {
  let routing = 0, falseAuto = 0, overEsc = 0, cat = 0, goldExec = 0;
  for (const t of FIXTURE) {
    const p = applyPolicy(t.c);
    if (p.decision === t.gold.decision) routing++;
    if (t.gold.decision === "ESCALATE" && p.decision === "EXECUTE") falseAuto++;
    if (t.gold.decision === "EXECUTE") { goldExec++; if (p.decision === "ESCALATE") overEsc++; }
    if (t.c.category === t.gold.category) cat++;
  }
  const n = FIXTURE.length;
  const fullAuto = ALL_TICKETS.filter(t => t.gold.decision === "EXECUTE").length / ALL_TICKETS.length;
  return { routing: routing / n, falseAuto, overEsc: goldExec ? overEsc / goldExec : 0, cat: cat / n, n,
           autoShare: [...results.values()].filter(p => p.decision === "EXECUTE").length / n,
           fullAuto, fullN: ALL_TICKETS.length };
}

function renderEval() {
  const m = evalMetrics();
  els.evalCard.hidden = false;
  els.evalCard.innerHTML = `
    <div class="eval-head">
      <span class="label">Eval mode</span>
      <span class="origin">scored against the ${m.n} labelled eval cases</span>
    </div>
    <dl class="metrics">
      <div class="metric"><dt>Routing accuracy</dt><dd>${(100 * m.routing).toFixed(0)}%</dd></div>
      <div class="metric" data-flag="${m.falseAuto ? "bad" : "good"}"><dt>False-auto</dt><dd>${m.falseAuto}</dd></div>
      <div class="metric"><dt>Over-escalation</dt><dd>${(100 * m.overEsc).toFixed(0)}%</dd></div>
      <div class="metric"><dt>Category accuracy</dt><dd>${(100 * m.cat).toFixed(0)}%</dd></div>
    </dl>
    <p class="eval-note">Fixture replay: classifications were written to match the labels, so this scores 100% by construction. These metrics need gold labels, which production traffic never has. This demo set is ${(100 * m.autoShare).toFixed(0)}% auto-handled; the full ${m.fullN}-case set is ${(100 * m.fullAuto).toFixed(0)}%, because it is packed with adversarial cases, and a real inbox is mostly routine.</p>`;
}

/* -------------------------------------------------------------- detail */
function renderDetail(i) {
  cancel(); const my = run;
  phase = "detail"; detailIndex = i;
  const t = FIXTURE[i], c = t.c, p = results.get(t.id) || applyPolicy(c);
  const kind = outcomeOf(p), d = disposed.get(t.id);

  els.counter.textContent = t.id;
  setStatus(kind === "handled" ? "Handled" : d ? "Closed by you" : "Awaiting you",
            { tone: kind === "handled" ? "done" : null });
  els.foot.textContent = `${p.risk_tier} tier · ${p.decision}`;
  els.back.hidden = false;
  els.go.hidden = true;
  els.evalCard.hidden = true;

  const uniq = [c.category, ...c.detected_intents].filter((x, k, a) => a.indexOf(x) === k);
  const derivLine = c.injection_detected
    ? "injection_detected = true → <b>BLOCK</b>"
    : `riskiest(${uniq.map(x => `${x} → ${CATEGORY_TIERS[x]}`).join(", ")}) = <b>${p.risk_tier}</b>`;
  const gateLine = `confidence ${c.confidence.toFixed(2)} ${c.confidence >= CONFIDENCE_THRESHOLD ? "≥" : "&lt;"} ${CONFIDENCE_THRESHOLD.toFixed(2)}`;

  els.body.innerHTML = `
    <div class="msg">
      <span class="avatar">${esc(initial(t.from))}</span>
      <div>
        <div class="msg-meta"><span class="msg-from">${esc(t.from)}</span><span class="msg-id mono">${t.id} · ${t.ticket.channel} · ${t.ticket.customer_id}</span></div>
        <div class="msg-subject" id="detailTitle" tabindex="-1">${esc(t.ticket.subject)}</div>
        <div class="bubble">${esc(t.ticket.body)}</div>
      </div>
    </div>

    <section class="panel">
      <div class="panel-head"><h2 class="label">Classification</h2><span class="origin mono">model · gemini-3.5-flash</span></div>
      <div class="cat-row"><span class="cat-name">${c.category}</span><span class="cat-conf mono">${c.confidence.toFixed(2)}</span></div>
      <div class="track" data-tier="${CATEGORY_TIERS[c.category]}"><div class="fill" id="fill"></div><i class="gate" aria-hidden="true"></i></div>
      <div class="track-legend mono"><span>0</span><span class="gate-label">0.70 gate</span><span>1.00</span></div>
      <div class="intents"><span class="label">Detected intents</span>${c.detected_intents.map(x => `<span class="chip" data-tier="${CATEGORY_TIERS[x]}">${x}</span>`).join("")}</div>
      ${c.injection_detected ? `<div class="flag">${ICON.warn}Embedded instruction detected, treated as data</div>` : ""}
      <p class="rationale">${esc(c.rationale)}</p>
    </section>

    <section class="panel">
      <div class="panel-head"><h2 class="label">Decision</h2><span class="origin mono">policy · src/policy.ts</span></div>
      <div class="verdict"><span class="tier" data-tier="${p.risk_tier}">${p.risk_tier}</span><span class="verdict-word" data-decision="${p.decision}">${p.decision}</span></div>
      <p class="why">${esc(plainWhy(c, p))}</p>
      <details class="trace">
        <summary>${ICON.chev}<span class="when-closed">Show policy trace</span><span class="when-open">Hide policy trace</span></summary>
        <div class="derivation mono"><span>${derivLine}</span><span class="sep" aria-hidden="true">·</span><span>${gateLine}</span></div>
        <ul class="reasons ${p.escalation_reasons.length ? "" : "none"}">
          ${p.escalation_reasons.length
            ? p.escalation_reasons.map(r => `<li>${esc(r)}</li>`).join("")
            : "<li>AUTO tier and confidence above the gate: the agent may act</li>"}
        </ul>
      </details>
    </section>

    <section class="panel">
      <div class="panel-head"><h2 class="label">Action</h2><span class="origin">${
        kind === "handled" ? "done by the agent" : kind === "proposal" ? "needs your approval" : "suppressed by policy"}</span></div>
      <div class="action">${actionMarkup(c, p, kind)}</div>
      ${dispositionMarkup(t, kind, d)}
    </section>`;

  const fill = $("fill");
  requestAnimationFrame(() => { if (my === run) fill.style.width = `${c.confidence * 100}%`; });
  focusEl($("detailTitle"));
  els.body.querySelectorAll("[data-act]").forEach(b =>
    b.addEventListener("click", () => dispose(b.dataset.id, b.dataset.act)));
  els.body.querySelectorAll("[data-undo]").forEach(b =>
    b.addEventListener("click", () => undo(b.dataset.undo)));
}

function actionMarkup(c, p, kind) {
  const a = c.proposed_action;
  if (kind === "unproposed") {
    return `<span class="action-mark" data-tier="${p.risk_tier}">${ICON.stop}</span>
      <div class="draft suppressed" data-tier="${p.risk_tier}"><div class="kicker">No action proposed</div>Routed to you with the classification only.</div>`;
  }
  if (kind === "proposal") {
    return `<span class="action-mark" data-tier="${p.risk_tier}">${ICON.hand}</span>
      <div class="draft" data-tier="${p.risk_tier}"><div class="kicker">Proposed: route to ${esc(a.params.queue || "a human")}</div>${esc(a.params.note || "")}</div>`;
  }
  if (a.type === "apply_tags") {
    return `<span class="action-mark" data-tier="AUTO">${ICON.check}</span>
      <div class="draft" data-tier="AUTO"><div class="kicker">Tags applied</div><div class="tags">${(a.params.tags || []).map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div></div>`;
  }
  const kicker = a.type === "send_reply" ? "Reply sent to customer" : `Routed to ${esc(a.params.queue || "queue")}`;
  return `<span class="action-mark" data-tier="AUTO">${ICON.spark}</span>
    <div class="draft" data-tier="AUTO"><div class="kicker">${kicker}</div>${esc(a.params.reply || a.params.note || "")}</div>`;
}

/** Approve and Reject exist only where the agent actually proposed something. */
function dispositionMarkup(t, kind, d) {
  if (kind === "handled") return "";
  if (d) return `<div class="item-actions" style="margin-top:14px"><span class="disposed" data-d="${d}">${d === "rejected" ? ICON.cross : ICON.check}${d[0].toUpperCase() + d.slice(1)}</span><button class="btn ghost sm" data-undo="${t.id}">Undo${who(t)}</button></div>`;
  return `<div class="item-actions" style="margin-top:14px">${
    kind === "proposal"
      ? `<button class="btn approve sm" data-act="approve" data-id="${t.id}">${ICON.check}Approve${who(t)}</button>
         <button class="btn sm" data-act="reject" data-id="${t.id}">${ICON.cross}Reject${who(t)}</button>`
      : `<button class="btn take sm" data-act="take" data-id="${t.id}">${ICON.hand}Take ticket${who(t)}</button>`}</div>`;
}

/* ------------------------------------------------------------ controls */
els.go.addEventListener("click", () => { if (phase === "idle" || phase === "result") startRun(); });
els.back.addEventListener("click", backToResults);
document.addEventListener("keydown", e => {
  if (e.target instanceof Element && e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
  if (e.key === "Escape" && phase === "detail") backToResults();
});

renderIdle();
</script>
